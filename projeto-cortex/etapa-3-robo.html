<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Projeto Córtex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: canvas 3D fixo em tela cheia; coluna de fichas à esquerda rola por cima (parallax), trilho de grupos à direita. */
:root{
  --bg:#07080f; --bg2:#10101f; --fg:#efeaf5; --muted:#a8a1b9; --faint:#6f6984;
  --line:rgba(239,234,245,.13); --panel:rgba(11,11,22,.74); --panel-solid:#0d0d1a;
  --tissue:#e8b9b1; --hi:#6f9bff;
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --gutter:max(16px,4vw);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;overflow-x:hidden}
.atmos{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 55% at 66% 46%,rgba(92,70,170,.30),transparent 70%),
             radial-gradient(40% 40% at 20% 90%,rgba(40,90,150,.18),transparent 70%),var(--bg)}
.grid{position:fixed;inset:-50% 0;z-index:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(239,234,245,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(239,234,245,.045) 1px,transparent 1px);
  background-size:64px 64px;will-change:transform;
  -webkit-mask-image:radial-gradient(70% 60% at 60% 50%,#000 20%,transparent 75%);mask-image:radial-gradient(70% 60% at 60% 50%,#000 20%,transparent 75%)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:pan-y;cursor:grab;display:block}
#gl.drag{cursor:grabbing}

/* Header */
.top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gutter) 12px;
  display:flex;align-items:center;gap:16px;justify-content:space-between;
  background:linear-gradient(var(--bg) 20%,rgba(7,8,15,0));pointer-events:none}
.brand{display:flex;flex-direction:column;line-height:1.15;pointer-events:auto}
.brand b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.01em}
.brand span{white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.stages{display:flex;gap:6px;list-style:none;margin:0;padding:0;pointer-events:auto}
.stages button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);
  font-size:12.5px;color:var(--muted);background:rgba(13,13,26,.6)}
.stages button b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--mono);font-size:11px;font-weight:500;border:1px dashed var(--faint)}
.stages .on button{color:var(--fg);border-color:rgba(239,234,245,.35)}
.stages .on button b{background:var(--fg);color:var(--bg);border:0}
.stages button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.bar{position:fixed;left:0;top:0;height:2px;z-index:6;background:var(--hi);width:0;transition:background .6s}

/* Rail */
.rail{position:fixed;right:var(--gutter);top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:4px}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:4px 0;font-size:11.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.02em}
.rail button i{display:block;width:14px;height:2px;border-radius:2px;background:currentColor;transition:width .35s,background .35s}
.rail button span{opacity:0;transform:translateX(6px);transition:opacity .3s,transform .3s;white-space:nowrap}
.rail:hover button span,.rail button.on span{opacity:1;transform:none}
.rail button.on{color:var(--fg)}
.rail button.on i{width:34px;background:var(--c)}
.rail button:focus-visible{outline:2px solid var(--hi);outline-offset:3px}

/* 3D tag */
.tag3d{position:fixed;left:0;top:0;z-index:3;pointer-events:none;display:flex;align-items:center;gap:8px;white-space:nowrap;
  font-family:var(--mono);font-size:11.5px;color:var(--fg);transition:opacity .35s;will-change:transform}
.tag3d .dot{width:10px;height:10px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 4px rgba(255,255,255,.08),0 0 18px var(--hi);flex:none}
.tag3d .stem{width:38px;height:1px;background:linear-gradient(90deg,var(--hi),rgba(255,255,255,.2))}
.tag3d .txt{padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:rgba(9,9,18,.82)}
.tag3d.flip{flex-direction:row-reverse}
.tag3d.flip .stem{background:linear-gradient(270deg,var(--hi),rgba(255,255,255,.2))}
.tag3d .txt em{font-style:normal;color:var(--hi);margin-right:6px}

/* Steps */
main{position:relative;z-index:2;pointer-events:none;padding-inline:var(--gutter)}
.step{position:relative;min-height:100vh;display:flex;align-items:center;padding-block:14vh}
.ghost{position:absolute;left:calc(var(--gutter) + 330px);top:50%;margin-top:-.55em;font-family:var(--display);font-weight:800;
  font-size:clamp(110px,19vw,300px);line-height:1;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px rgba(239,234,245,.10);
  pointer-events:none;will-change:transform;user-select:none;white-space:nowrap}
.card{pointer-events:auto;position:relative;width:min(430px,100%);background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:14px;padding:20px 22px 16px;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.code{color:var(--bg);background:var(--c);padding:2px 7px;border-radius:4px;font-weight:500}
.grp{display:flex;align-items:center;gap:6px}
.grp i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.idx{margin-left:auto;font-variant-numeric:tabular-nums}
.card h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.1vw,38px);line-height:1.02;letter-spacing:-.02em;margin:14px 0 4px;text-wrap:balance}
.alt{margin:0 0 12px;color:var(--muted);font-size:13px}
.facts{margin:0;display:grid;gap:10px}
.facts div{display:grid;gap:2px}
.facts dt{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
.facts dd{margin:0;max-width:62ch}
.facts .role dd{font-size:16px;color:var(--fg)}
.note{margin-top:12px;padding:10px 12px;border-left:2px solid var(--c);background:rgba(239,234,245,.04);border-radius:0 8px 8px 0;font-size:13.5px;color:var(--muted)}
.note b{color:var(--fg);font-weight:600}
.paths{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.paths span{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.paths span b{color:var(--c);font-weight:500}
.pending{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.parts{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.parts li{display:grid;grid-template-columns:128px 1fr;gap:10px;font-size:13.5px;align-items:baseline}
.parts b{font-weight:600}
.parts span{color:var(--muted)}
.parts li.glia b{color:var(--c)}
canvas.syn{display:block;width:100%;height:230px;margin-top:12px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--line)}

/* Hero */
.step.hero .card{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;width:min(560px,100%)}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.eyebrow i{width:26px;height:1px;background:var(--hi)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,6.2vw,84px);line-height:.94;letter-spacing:-.035em;margin:18px 0 18px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--tissue)}
.hero p.lead{font-size:17px;color:var(--muted);max-width:48ch;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:28px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)}
.stats div{background:rgba(9,9,18,.8);padding:12px 12px 10px}
.stats b{display:block;font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block}
.hint{margin-top:22px;font-family:var(--mono);font-size:12px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}
.hint span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hi);margin-right:7px;vertical-align:1px}

/* Wide sections */
.step.wide{justify-content:center}
.step.wide .card{width:min(1120px,100%);background:rgba(10,10,20,.9);padding:26px 26px 22px}
.wide h2{margin-top:6px}
.lede{color:var(--muted);max-width:70ch;margin:6px 0 18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);color:var(--fg);background:rgba(239,234,245,.05)}
.btn:hover{background:rgba(239,234,245,.1)}
.btn:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cat-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.cat{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
.cat th{text-align:left;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel-solid)}
.cat td{padding:9px 12px;border-bottom:1px solid rgba(239,234,245,.06);vertical-align:top}
.cat tr.row{cursor:pointer}
.cat tr.row:hover td{background:rgba(239,234,245,.04)}
.cat tr.row:focus-visible{outline:2px solid var(--hi);outline-offset:-2px}
.cat td.c{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--c)}
.cat td.n{font-weight:600;white-space:nowrap}
.cat td.r{color:var(--muted)}
.cat tr.gh td{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);padding-top:16px;background:rgba(239,234,245,.02)}
pre.json{max-height:260px;overflow:auto;font-family:var(--mono);font-size:11.5px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--muted);white-space:pre}
.toast{font-family:var(--mono);font-size:12px;color:var(--hi);align-self:center}
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.road article{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;background:rgba(239,234,245,.025)}
.road article.done{border-color:rgba(239,234,245,.4);background:rgba(239,234,245,.06)}
.road .st{font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.road .done .st em{color:#7ff0b2}
.road em{font-style:normal}
.road h3{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0;line-height:1.05}
.road p{margin:0;color:var(--muted);font-size:13.5px}
.road ul{margin:0;padding-left:16px;color:var(--muted);font-size:13px;display:grid;gap:3px}
.road code{font-family:var(--mono);font-size:11.5px;color:var(--fg)}
.foot{margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* Etapa 3 */
.right{display:flex;align-items:center;gap:10px;pointer-events:auto}
.view{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(13,13,26,.7)}
.view button{all:unset;cursor:pointer;font-size:12.5px;padding:5px 12px;border-radius:999px;color:var(--muted)}
.view button[aria-pressed="true"]{background:#7ee8ff;color:#06121a;font-weight:600}
.view button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.s3{margin-top:14px;padding:14px;border-radius:12px;border:1px solid rgba(126,232,255,.28);background:linear-gradient(160deg,rgba(126,232,255,.08),rgba(126,232,255,.02));display:grid;gap:11px}
.s3h{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#bff3ff}
.s3h span{padding:2px 6px;border-radius:4px;background:#7ee8ff;color:#06121a}
.rmod{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rmod small,.param small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.rmod b{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1;letter-spacing:-.01em;color:#e6fbff}
.mat{font-style:normal;font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none;border:1px solid}
.mat.m2{color:#7ff0b2;border-color:rgba(127,240,178,.5);background:rgba(127,240,178,.08)}
.mat.m1{color:#ffd56a;border-color:rgba(255,213,106,.5);background:rgba(255,213,106,.08)}
.mat.m0{color:#ff9fd0;border-color:rgba(255,159,208,.5);background:rgba(255,159,208,.08)}
.s3 p{margin:0;font-size:14px;color:#dcecf2;max-width:62ch}
.s3 h4{margin:0 0 5px;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.tech{display:flex;flex-wrap:wrap;gap:5px}
.tech span{font-size:12px;padding:3px 8px;border-radius:6px;background:rgba(126,232,255,.1);color:#cdeef6}
.param code{font-family:var(--mono);font-size:13px;color:#7ee8ff}
.care{border-left:2px solid #7ee8ff;padding-left:10px}
.care p{font-size:13.5px;color:var(--muted)}
details.s2d{margin-top:12px;border-top:1px solid var(--line)}
details.s2d>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:12px 0 2px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
details.s2d>summary::-webkit-details-marker{display:none}
details.s2d>summary span{white-space:nowrap;flex:none;padding:2px 6px;border-radius:4px;border:1px solid var(--c);color:var(--c)}
details.s2d>summary::after{content:"+";margin-left:auto;font-size:15px;color:var(--fg)}
details.s2d[open]>summary::after{content:"–"}
details.s2d>summary:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
details.s2d .s2{border-top:0;margin-top:4px}
.mat-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 18px}
.mat-sum div{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;min-width:0}
.mat-sum b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mat-sum span{font-size:12.5px;color:var(--muted)}
.layers{display:grid;gap:8px}
.layer{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:stretch}
.layer .ln{display:grid;place-items:center;border-radius:10px;font-family:var(--display);font-weight:800;font-size:22px;color:#06121a;background:linear-gradient(#7ee8ff,#3fa9c9)}
.layer:nth-child(n+4) .ln{background:linear-gradient(#b8f3ff,#7ee8ff)}
.layer .lb{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;min-width:0;background:rgba(126,232,255,.03)}
.lt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.lt h3{margin:0;font-family:var(--display);font-size:17px;font-weight:700}
.lt span{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);margin:8px 0 0 56px}
.bus{display:grid;grid-template-columns:1fr 2fr 1fr;gap:12px;margin-top:14px}
.bus>div{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.bus h4{margin:0 0 6px;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
h3.ph{font-family:var(--display);font-size:22px;margin:24px 0 10px}
.principles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.principles article{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;align-content:start;min-width:0}
.principles b{font-size:15px}
.principles p{margin:0;color:var(--muted);font-size:13.5px}
.principles .chip{justify-self:start}
/* Etapa 2 */
.s2{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:12px}
.s2h{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg)}
.s2h span{padding:2px 6px;border-radius:4px;border:1px solid var(--c);color:var(--c)}
.s2 p{margin:0;font-size:14px;color:#d9d3e3;max-width:62ch}
.s2 h4{margin:0 0 5px;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.io>div{min-width:0}
.io ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.io li{position:relative;padding-left:14px}
.io .in li::before{content:"→";position:absolute;left:0;color:var(--faint)}
.io .out li::before{content:"→";position:absolute;left:0;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--muted);background:rgba(239,234,245,.03)}
.chip b{white-space:nowrap;font-family:var(--mono);font-weight:500;font-size:11px;color:var(--bg);background:var(--cc);padding:1px 5px;border-radius:3px}
.chip:hover{border-color:rgba(239,234,245,.35);color:var(--fg)}
.chip:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.fail{padding:10px 12px;border-radius:8px;background:rgba(255,107,90,.07);border:1px solid rgba(255,107,90,.22)}
.fail h4{color:#ff9a8c}
.fail p{font-size:13.5px;color:#e6d6d4}
ol.chain{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:0;counter-reset:st}
ol.chain li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:10px;position:relative;padding-bottom:12px}
ol.chain li::before{content:counter(st);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--c);color:var(--c);font-family:var(--mono);font-size:11px;background:var(--panel-solid);position:relative;z-index:1}
ol.chain li:not(:last-child)::after{content:"";position:absolute;left:12px;top:24px;bottom:0;width:1px;background:linear-gradient(var(--c),rgba(239,234,245,.1))}
ol.chain li>div{display:grid;gap:3px;padding-top:2px;min-width:0}
ol.chain li span{font-size:13.5px;color:#d9d3e3}
.mtags{position:fixed;inset:0;z-index:3;pointer-events:none}
.mtag{position:absolute;left:0;top:0;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(9,9,18,.78);border:1px solid rgba(239,234,245,.16);color:var(--muted);white-space:nowrap;transition:opacity .3s;will-change:transform}
.mtag i{font-style:normal;color:var(--hi);margin-right:4px}
.stages .done button b{background:rgba(127,240,178,.15);border:1px solid #7ff0b2;color:#7ff0b2}
@media (max-width:1080px){.road{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .bus,.principles,.mat-sum{grid-template-columns:1fr}
  .axis{margin-left:0}
  .rail{display:none}
  .stages button span{display:none}
  .stages button{padding:4px}
  .step{min-height:100vh;align-items:flex-end;padding-block:50vh 18px}
  .io{grid-template-columns:1fr}
  .mtag{display:none}
  .ghost{left:var(--gutter);top:18%}
  .step.hero{align-items:flex-end}
  .step.hero .card{max-height:none;background:linear-gradient(rgba(7,8,15,0),var(--bg) 22%);padding-top:40px}
  .hero h1{font-size:clamp(34px,10vw,54px)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .step.wide{align-items:center;padding-block:80px 24px}
  .step.wide .card{max-height:none;padding:18px}
  .road{grid-template-columns:1fr}
  .parts li{grid-template-columns:110px 1fr}
}
@media (max-width:520px){.stages{display:none}}
@media (prefers-reduced-motion:reduce){.ghost{transform:none!important}}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

    if(x0>=y0){if(y0>=z0){i1=1;j1=0;k1=0;i2=1;j2=1;k2=0}else if(x0>=z0){i1=1;j1=0;k1=0;i2=1;j2=0;k2=1}else{i1=0;j1=0;k1=1;i2=1;j2=0;k2=1}}
    else{if(y0<z0){i1=0;j1=0;k1=1;i2=0;j2=1;k2=1}else if(x0<z0){i1=0;j1=1;k1=0;i2=0;j2=1;k2=1}else{i1=0;j1=1;k1=0;i2=1;j2=1;k2=0}}
    const x1=x0-i1+G3,y1=y0-j1+G3,z1=z0-k1+G3,x2=x0-i2+2*G3,y2=y0-j2+2*G3,z2=z0-k2+2*G3,x3=x0-1+3*G3,y3=y0-1+3*G3,z3=z0-1+3*G3;
    const ii=i&255,jj=j&255,kk=k&255;let q;
    let t0=.6-x0*x0-y0*y0-z0*z0;if(t0>0){q=pm[ii+perm[jj+perm[kk]]]*3;t0*=t0;n0=t0*t0*(g3[q]*x0+g3[q+1]*y0+g3[q+2]*z0)}

    let t2=.6-x2*x2-y2*y2-z2*z2;if(t2>0){q=pm[ii+i2+perm[jj+j2+perm[kk+k2]]]*3;t2*=t2;n2=t2*t2*(g3[q]*x2+g3[q+1]*y2+g3[q+2]*z2)}

}

function buildHemisphere(side){
  const W=300,H=220;
  const g=new THREE.SphereGeometry(1,W,H);
  const P=g.attributes.position,count=P.count;
  const U=new Float32Array(count*3);

    U[i*3]=sx;U[i*3+1]=sy;U[i*3+2]=sz;
    const lat= sx>0 ? sx*0.66 : sx*0.235;
    const taper=(1-0.14*Math.max(0,sz))*(1-0.07*Math.max(0,-sz)*Math.max(0,-sz));
    const x=0.25+lat*taper;
    let y;
    if(sy>=0) y=sy*0.70*(1-0.12*Math.max(0,sz)*Math.max(0,sz))*(1-0.06*Math.max(0,-sz));
    else{
      const tm=Math.exp(-Math.pow((sz-0.12)/0.4,2))*sm(-0.25,0.5,sx);

  }

  const nz=makeNoise(side>0?11:29);
  const acc={};
  for(let i=0;i<count;i++){
    const sx=U[i*3],sy=U[i*3+1],sz=U[i*3+2];
    const px=P.getX(i),py=P.getY(i),pz=P.getZ(i);
    const wx=nz(px*1.7+3.1,py*1.7,pz*1.7)*0.32,wy=nz(px*1.7,py*1.7+7.3,pz*1.7)*0.32,wz=nz(px*1.7,py*1.7,pz*1.7+1.9)*0.32;

    // regiões

    if(L===2){ if(sz>zc-0.11) A=4; }

}
function blurAttr(idx,arr,dim,iters){

      for(let d=0;d<dim;d++){const s=arr[a*dim+d]+arr[b*dim+d]+arr[c*dim+d];sum[a*dim+d]+=s;sum[b*dim+d]+=s;sum[c*dim+d]+=s}
      cnt[a]+=3;cnt[b]+=3;cnt[c]+=3}
    for(let i=0;i<n;i++)if(cnt[i])for(let d=0;d<dim;d++)arr[i*dim+d]=sum[i*dim+d]/cnt[i]}
}

  for(let k=0;k<mtagEls.length;k++){const e=curEnds[k],d=mtagEls[k];if(!e||!on){d.style.opacity=0;continue}
    mp.copy(e.p).project(camera);const x=(mp.x*0.5+0.5)*vw,y=(-mp.y*0.5+0.5)*vh;
    const vis=mp.z<1&&x>20&&x<vw-60&&y>70&&y<vh-20;d.style.opacity=vis?0.9:0;d.style.transform=`translate3d(${x+8}px,${y-9}px,0)`}
}

/* ---------- Visual Humano / Robô ---------- */
const STEEL=new THREE.Color('#56627c'),ROBOC=new THREE.Color('#7ee8ff');
let robotMode=true;try{if(localStorage.getItem('pc-view')==='human')robotMode=false}catch(e){}
const viewBtns=[...document.querySelectorAll('#view button')];
function updateTag(){const s=S[active];if(!s)return;
  if(s.kind&&s.kind!=='circuit'){tag.style.opacity=0;return}
  const r=robotMode&&(R[s.code]||RC[s.code]);tagtxt.innerHTML=`<em>${s.code}</em>${r?r.m:s.name}`;tag.style.opacity=1}
function setView(r){robotMode=r;viewBtns.forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.v==='robot')===r)));try{localStorage.setItem('pc-view',r?'robot':'human')}catch(e){};updateTag()}
viewBtns.forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v==='robot')));

/* ================================================================
   ESTADO, CÂMERA E ROLAGEM
   ================================================================ */
const tag=document.getElementById('tag'),tagtxt=document.getElementById('tagtxt'),bar=document.getElementById('bar'),gridEl=document.getElementById('grid');
const railBtns=[...rail.querySelectorAll('button')];
let active=-1,sectionP=0;
const cam={t:new THREE.Vector3(0,0,0),d:new THREE.Vector3(0.8,0.42,0.55).normalize(),r:4.4};
const U=cortexMat.uniforms;
const target={tint:0,xray:0,dim:0,net:0};
let yawUser=0,pitchUser=0,idleT=0,autoYaw=0;
let vw=innerWidth,vh=innerHeight,isMobile=vw<860;

function setActive(i){
  if(i===active)return;active=i;const s=S[i];
  const c=colorOf(s);
  document.documentElement.style.setProperty('--hi',c);
  U.uHiCol.value.set(c);U.uHi.value=0;
  const f=s.f||{};
  setMatch(f);
  target.tint=s.tint!=null?s.tint:0.1;
  target.xray=s.mode==='xray'?1:0;
  target.dim=(f.lobe||f.area)?1:0;
  target.net=s.net||0;
  pulseMode=s.pulse||(!s.kind&&F[s.code]?'links':'surface');
  pulseTarget=pulseMode==='surface'?(s.mode==='xray'?0:80):(pulseMode==='network'?420:(pulseMode==='ADO'?260:(pulseMode==='links'||pulseMode==='chain'?160:300)));
  pointMat.depthTest=!(pulseMode==='links'||pulseMode==='chain');
  // reinicia pulsos para o novo modo
  pulses.forEach((p,k)=>{p.t=2;p.delay=Math.random()*(k<pulseTarget?1.2:0.1)});
  const focusKeys=new Set((f.s)||[]);
  structs.forEach(o=>{o.focus=focusKeys.has(o.key)});
  const g=s.group;railBtns.forEach(b=>b.classList.toggle('on',b.dataset.g===g));
  updateTag();
  setLinks(s);
  if(s.syn)startSyn();
}

let offsets=[];
function measure(){offsets=stepEls.map(el=>[el.offsetTop,el.offsetHeight])}
function onScroll(){
  const y=scrollY,mid=y+vh/2;let best=0,bd=1e9;
  for(let i=0;i<offsets.length;i++){const c=offsets[i][0]+offsets[i][1]/2;const d=Math.abs(c-mid);if(d<bd){bd=d;best=i}}
  setActive(best);
  const o=offsets[best];sectionP=(mid-(o[0]+o[1]/2))/o[1];
  const max=document.documentElement.scrollHeight-vh;bar.style.width=(max>0?y/max*100:0)+'%';
  if(!reduced){
    for(let i=0;i<ghosts.length;i++){const g=ghosts[i];if(!g)continue;const c=offsets[i][0]+offsets[i][1]/2;const d=c-mid;if(Math.abs(d)>vh*1.5)continue;g.style.transform=`translate3d(${d*-0.04}px,${d*-0.38}px,0)`}
    gridEl.style.transform=`translate3d(0,${-(y*0.12)%64}px,0)`;
  }
}

function resize(){
  vw=innerWidth;vh=innerHeight;isMobile=vw<860;
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(vw,vh,false);
  camera.aspect=vw/vh;
  if(isMobile)camera.setViewOffset(vw,vh,0,vh*0.22,vw,vh);
  else camera.setViewOffset(vw,vh,-Math.min(260,vw*0.17),0,vw,vh);
  camera.updateProjectionMatrix();
  pointMat.uniforms.uScale.value=vh*renderer.getPixelRatio()/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
  measure();onScroll();sizeSyn();
}
addEventListener('resize',resize);
addEventListener('scroll',onScroll,{passive:true});

// Arrastar / clicar
let dragging=false,downX=0,downY=0,lastX=0,lastY=0,moved=0;
const mouse={x:0,y:0};
canvas.addEventListener('pointerdown',e=>{dragging=true;moved=0;downX=lastX=e.clientX;downY=lastY=e.clientY;canvas.classList.add('drag');try{canvas.setPointerCapture(e.pointerId)}catch(_){} });
addEventListener('pointermove',e=>{
  mouse.x=e.clientX/vw*2-1;mouse.y=e.clientY/vh*2-1;
  if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  yawUser-=dx*0.007;pitchUser=Math.max(-1.1,Math.min(1.1,pitchUser+dy*0.005));idleT=0;
});
const endDrag=e=>{if(!dragging)return;dragging=false;canvas.classList.remove('drag');if(moved<6&&e.type==='pointerup')pick(e.clientX,e.clientY)};
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(x,y){
  ndc.set(x/vw*2-1,-(y/vh)*2+1);ray.setFromCamera(ndc,camera);
  const xr=U.uXray.value>0.5;
  const targets=xr?structs.filter(o=>!o.external||true).map(o=>o.mesh):[...hemis,...structs.filter(o=>o.external).map(o=>o.mesh)];
  const hit=ray.intersectObjects(targets,false)[0];if(!hit)return;
  let idx=-1;
  if(hit.object.userData.cortex){
    const g=hit.object.geometry;const a=hit.face.a;const A=g.userData.area[a],L=g.userData.lobe[a];
    idx=S.findIndex(s=>s.f&&s.f.area===A);if(idx<0)idx=S.findIndex(s=>s.f&&s.f.lobe===L);
  }else{
    const o=structs.find(o=>o.mesh===hit.object);if(o)idx=S.findIndex(s=>!s.kind&&s.f&&s.f.s&&s.f.s.includes(o.key)&&!s.pulse);
    if(idx<0&&o)idx=S.findIndex(s=>!s.kind&&s.f&&s.f.s&&s.f.s.includes(o.key));
    if(idx<0&&o)idx=S.findIndex(s=>s.f&&s.f.s&&s.f.s.includes(o.key));
  }
  if(idx>=0)goTo(idx);
}

/* ---------- Loop ---------- */
const clock=new THREE.Clock();
const tmpD=new THREE.Vector3(),tmpT=new THREE.Vector3(),yAxis=new THREE.Vector3(0,1,0),side=new THREE.Vector3(),proj=new THREE.Vector3();
const hiC=new THREE.Color(),tmpCol=new THREE.Color(),tmpEm=new THREE.Color();
function frame(){
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  const s=S[active]||S[0];
  const k=1-Math.exp(-dt*(reduced?6:2.6));
  cam.t.lerp(s._t,k);cam.d.lerp(s._d,k).normalize();
  const rr=s._r*(isMobile?(vw/vh<0.7?1.95:1.3):1);cam.r+=(rr-cam.r)*k;
  if(!dragging){idleT+=dt;if(idleT>2.5){yawUser*=Math.exp(-dt*0.8);pitchUser*=Math.exp(-dt*0.8)}}
  if(s.auto&&!reduced)autoYaw+=dt*0.12;else autoYaw*=Math.exp(-dt*1.5);
  const scrollYaw=reduced?0:sectionP*0.35;
  const mx=reduced?0:mouse.x*0.06,my=reduced?0:mouse.y*0.04;
  tmpD.copy(cam.d).applyAxisAngle(yAxis,yawUser+autoYaw+scrollYaw+mx);
  side.crossVectors(tmpD,yAxis).normalize();
  tmpD.applyAxisAngle(side,pitchUser+my);
  camera.position.copy(cam.t).addScaledVector(tmpD,cam.r);
  camera.lookAt(cam.t);

  // Uniforms
  U.uTime.value=t;
  U.uHi.value+=(1-U.uHi.value)*(1-Math.exp(-dt*3));
  U.uTint.value+=(target.tint-U.uTint.value)*k;
  U.uXray.value+=(target.xray-U.uXray.value)*(1-Math.exp(-dt*3.2));
  U.uDim.value+=(target.dim-U.uDim.value)*k;
  const xr=U.uXray.value;
  cortexMat.depthWrite=xr<0.5;
  netLines.material.opacity+=(target.net*0.22-netLines.material.opacity)*k;
  linkLines.material.opacity+=((curLinks.length?0.55:0)-linkLines.material.opacity)*k;
  dotMat.uniforms.uScale.value=pointMat.uniforms.uScale.value;dotMat.uniforms.uAlpha.value=Math.min(1,linkLines.material.opacity*1.8)*(0.75+0.25*Math.sin(t*4));
  nodePts.material.opacity+=(target.net*0.8-nodePts.material.opacity)*k;

  // Estruturas
  U.uRobot.value+=((robotMode?1:0)-U.uRobot.value)*(1-Math.exp(-dt*2.5));
  hiC.set(colorOf(s));
  const pulse=0.55+0.45*Math.sin(t*3);
  for(const o of structs){
    const m=o.mesh.material;let op,em;
    if(o.focus){tmpCol.copy(hiC).lerp(o.color,0.35);op=1;tmpEm.copy(hiC).multiplyScalar(0.35+0.3*pulse)}
    else if(xr>0.5){tmpCol.copy(o.color).multiplyScalar(0.8);op=(s.f&&s.f.s&&s.f.s.length)||s.pulse?0.26:0.55;tmpEm.copy(o.color).multiplyScalar(0.12)}
    else if(robotMode){tmpCol.copy(STEEL);op=1;tmpEm.copy(o.external&&o.tint?ROBOC:o.color).multiplyScalar(0.16)}
    else{tmpCol.copy(o.tint?TISSUE:o.color);op=1;tmpEm.setRGB(0,0,0);if(!o.tint&&o.external)tmpCol.lerp(TISSUE,0.35)}
    m.metalness+=((robotMode?0.55:0.02)-m.metalness)*k;m.roughness+=((robotMode?0.38:0.55)-m.roughness)*k;
    m.color.lerp(tmpCol,k);m.emissive.lerp(tmpEm,k);m.opacity+=(op-m.opacity)*k;m.depthWrite=m.opacity>0.95;
    o.mesh.visible=o.external||xr>0.02;
  }

  // Parallax da poeira
  const sy=scrollY/vh;
  for(const d of dust){d.position.y=sy*d.userData.k*0.35;d.rotation.y=t*0.01*(1+d.userData.k)}

  updatePulses(dt);
  pointMat.uniforms.uAlpha.value=pulseMode==='surface'&&xr>0.5?0:1;
  renderer.render(scene,camera);

  // Etiqueta 3D
  updateMtags();
  if(!s.kind||s.kind==='circuit'){
    proj.copy(s._anchor).project(camera);
    const x=(proj.x*0.5+0.5)*vw,y=(-proj.y*0.5+0.5)*vh;
    const cardEl=isMobile&&stepEls[active]?stepEls[active].querySelector('.card'):null;
    const cardTop=cardEl?cardEl.getBoundingClientRect().top:vh;
    const vis=proj.z<1&&x>0&&x<vw&&y>70&&y<vh&&y<cardTop-16;
    const tw=tag.offsetWidth||0,flip=x+tw>vw-12;
    tag.classList.toggle('flip',flip);
    tag.style.transform=`translate3d(${flip?x-tw+5:x-5}px,${y-5}px,0)`;tag.style.opacity=vis?1:0;
  }
  if(synOn)drawSyn(t);
  requestAnimationFrame(frame);
}

/* ================================================================
   SINAPSE 2D
   ================================================================ */
let synCanvas=null,synCtx=null,synW=0,synH=0,synOn=false;const mols=[];const vesc=[];const recs=[];
function sizeSyn(){synCanvas=document.getElementById('synCanvas');if(!synCanvas)return;const r=synCanvas.getBoundingClientRect();const dpr=Math.min(devicePixelRatio||1,2);synW=r.width;synH=r.height;synCanvas.width=Math.round(synW*dpr);synCanvas.height=Math.round(synH*dpr);synCtx=synCanvas.getContext('2d');synCtx.setTransform(dpr,0,0,dpr,0,0);
  vesc.length=0;for(let i=0;i<11;i++)vesc.push({x:0.3+0.4*Math.random(),y:0.15+0.2*Math.random(),ph:Math.random(),r:6+Math.random()*3});
  recs.length=0;for(let i=0;i<9;i++)recs.push({x:0.28+i*0.055,on:0});}
function startSyn(){synOn=true;if(!synCtx)sizeSyn()}
const synIO=new IntersectionObserver(es=>es.forEach(e=>{synOn=e.isIntersecting}),{threshold:0});
function drawSyn(t){
  if(!synCtx||!synW)return;const c=synCtx,w=synW,h=synH;c.clearRect(0,0,w,h);
  const cx=w*0.52,memY=h*0.47,postY=h*0.6,half=Math.min(w*0.3,170);
  // pré-sináptico
  c.beginPath();c.moveTo(cx-16,-2);c.bezierCurveTo(cx-18,h*0.12,cx-half,h*0.14,cx-half,memY-24);c.quadraticCurveTo(cx-half,memY,cx-half+24,memY);c.lineTo(cx+half-24,memY);c.quadraticCurveTo(cx+half,memY,cx+half,memY-24);c.bezierCurveTo(cx+half,h*0.14,cx+18,h*0.12,cx+16,-2);c.closePath();
  c.fillStyle='rgba(111,155,255,.13)';c.fill();c.strokeStyle='rgba(143,190,255,.8)';c.lineWidth=1.5;c.stroke();
  // pós-sináptico
  c.beginPath();c.moveTo(cx-half-10,h+2);c.lineTo(cx-half-10,postY+22);c.quadraticCurveTo(cx-half-10,postY,cx-half+14,postY);c.lineTo(cx+half-14,postY);c.quadraticCurveTo(cx+half+10,postY,cx+half+10,postY+22);c.lineTo(cx+half+10,h+2);c.closePath();
  c.fillStyle='rgba(255,111,145,.1)';c.fill();c.strokeStyle='rgba(255,140,170,.75)';c.stroke();
  // receptores
  recs.forEach((r,i)=>{const x=cx-half+ (i+0.5)*(2*half/recs.length);r.px=x;r.on*=0.93;c.fillStyle=`rgba(255,${150+Math.round(r.on*100)},${170+Math.round(r.on*60)},${0.45+r.on*0.55})`;c.fillRect(x-4,postY-6,8,7);if(r.on>0.1){c.fillStyle=`rgba(255,220,240,${r.on*0.35})`;c.beginPath();c.arc(x,postY+8,10*r.on+2,0,Math.PI*2);c.fill()}});
  // vesículas
  vesc.forEach(v=>{v.ph+=0.004+0.002*Math.sin(t+v.x*10);if(v.ph>1){v.ph=0;v.x=0.3+0.4*Math.random();v.y=0.12+0.2*Math.random()}
    const X=cx+(v.x-0.5)*2*half*0.9;
    const y0=h*v.y,y1=memY-v.r-1;const k=Math.min(1,v.ph/0.8);const Y=y0+(y1-y0)*k*k;
    if(v.ph<0.8){c.beginPath();c.arc(X,Y,v.r,0,Math.PI*2);c.fillStyle='rgba(255,207,77,.18)';c.fill();c.strokeStyle='rgba(255,207,77,.8)';c.lineWidth=1.2;c.stroke();
      for(let q=0;q<4;q++){c.fillStyle='#ffcf4d';c.fillRect(X-3+((q*5)%7)-1,Y-3+((q*3)%6)-1,2,2)}}
    else if(!v.fired){v.fired=true;for(let q=0;q<7;q++)mols.push({x:X+(Math.random()-.5)*8,y:memY+1,vx:(Math.random()-.5)*0.5,vy:0.35+Math.random()*0.5,life:1})}
    if(v.ph<0.8)v.fired=false;
    if(v.ph>=0.8){const a=(v.ph-0.8)/0.2;c.strokeStyle=`rgba(255,207,77,${0.8*(1-a)})`;c.beginPath();c.arc(X,memY,v.r*(1-a*0.6),Math.PI,0,false);c.stroke()}
  });
  // moléculas
  for(let i=mols.length-1;i>=0;i--){const m=mols[i];m.x+=m.vx;m.y+=m.vy;m.vx+=(Math.random()-.5)*0.15;
    if(m.y>=postY-6){let best=null,bd=1e9;recs.forEach(r=>{const d=Math.abs(r.px-m.x);if(d<bd){bd=d;best=r}});if(best&&bd<10)best.on=1;mols.splice(i,1);continue}
    c.fillStyle='#ffcf4d';c.beginPath();c.arc(m.x,m.y,1.8,0,Math.PI*2);c.fill()}
  // potencial de ação descendo pelo axônio
  const ap=(t*0.8)%1;c.fillStyle='rgba(143,233,255,.9)';c.beginPath();c.arc(cx,ap*h*0.3,3.5,0,Math.PI*2);c.fill();
  // rótulos
  c.font='11px "IBM Plex Mono", ui-monospace, monospace';c.fillStyle='rgba(239,234,245,.72)';c.textBaseline='middle';
  const lx=cx+half+16, fits=lx+130<w;
  const lab=(txt,y,col)=>{c.fillStyle=col||'rgba(239,234,245,.72)';if(fits){c.textAlign='left';c.fillText(txt,lx,y)}else{c.textAlign='left';c.fillText(txt,6,y)}};
  if(fits){lab('terminal pré-sináptico',h*0.2);lab('vesículas',h*0.33,'rgba(255,207,77,.9)');lab('fenda ~20 nm',(memY+postY)/2,'rgba(239,234,245,.9)');lab('receptores',postY+2,'rgba(255,160,185,.95)');lab('neurônio pós-sináptico',h*0.85)}
  else{c.textAlign='left';c.fillStyle='rgba(239,234,245,.8)';c.fillText('pré-sináptico',6,h*0.3);c.fillText('fenda ~20 nm',6,(memY+postY)/2);c.fillText('pós-sináptico',6,h-12)}
  c.textAlign='left';c.fillStyle='rgba(143,233,255,.9)';c.fillText('potencial de ação',cx+24,h*0.06+4);
}

/* ---------- Início ---------- */
setView(robotMode);
resize();
const sc=document.getElementById('synCanvas');if(sc)synIO.observe(sc);
setActive(0);onScroll();
requestAnimationFrame(frame);
if(location.hash){const i=S.findIndex(s=>'#'+s.id===location.hash);if(i>0)setTimeout(()=>goTo(i),300)}
})();
</script>
</body></html>
